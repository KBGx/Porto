[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loophole-levitator"
version = "0.1.0"
description = "An honest attempt at an anti-gravity device: the physics graveyard and a passive diamagnetically stabilised levitator."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["loophole"]

[tool.pytest.ini_options]
testpaths = ["tests"]
